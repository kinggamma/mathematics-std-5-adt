<body class="min-h-screen flex items-center justify-center">
    <main class="w-full">
      <div id="content" class="container mx-auto w-full max-w-5xl px-8 py-8 max-sm:px-5 opacity-0"><section data-section-type="text_and_single_image" data-section-id="pg116_sec001" class="rounded-[2rem] border border-emerald-200 bg-white p-8 shadow-sm max-sm:p-5"><h1 class="adt-h2 mb-5 text-emerald-800">Example 2</h1><p class="adt-body mb-4">Find the value of <i>y</i> if <i>y + 12 + 2y = 69</i>.</p><h3 class="adt-h3 mb-3">Solution</h3><div class="adt-body space-y-3"><p>Combine the like terms, then add.</p><p>y + 2y + 12 = 69</p><p>3y + 12 = 69</p><p>Subtract 12 from both sides of the equation.</p><p>3y + 12 &#x2212; 12 = 69 &#x2212; 12</p><p>3y = 57</p><p>Divide both sides of the equation by 3.</p><p><math><mfrac><mrow><mn>3</mn><mi>y</mi></mrow><mn>3</mn></mfrac><mo>=</mo><mfrac><mn>57</mn><mn>3</mn></mfrac></math></p><p>y = 19</p><p class="font-semibold text-emerald-900">Therefore, the value of <i>y</i> is 19.</p></div></section></div>
