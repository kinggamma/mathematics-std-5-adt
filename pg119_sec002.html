<body class="min-h-screen flex items-center justify-center">
    <main class="w-full">
      <div id="content" class="container opacity-0"><section data-section-type="boxed_text" data-section-id="pg119_sec002" class="mx-auto w-full max-w-5xl px-8 max-sm:px-5 pt-6 pb-8 bg-white text-slate-800"><div class="mb-3"><h1 data-id="pg119_n0053" class="adt-h2 font-bold text-slate-900">Subtraction in simple equations</h1></div><div class="rounded-[2rem] border border-emerald-700/35 bg-white shadow-[0_2px_8px_rgba(0,0,0,0.06)] overflow-hidden"><div class="px-5 pt-0 pb-5 max-sm:px-4"><div class="inline-block -mt-[1px] ml-4 max-sm:ml-3 mb-4 rounded-b-[1.8rem] border-2 border-emerald-700 bg-lime-100 px-5 py-2 shadow-sm"><h3 data-id="pg119_n0056" class="adt-h3 font-bold text-emerald-900">Example 1</h3></div><p class="adt-body text-left leading-relaxed mb-4"><span data-id="pg119_n0058">Find the value of k in the equation <math><mrow><mi>k</mi><mo>−</mo><mn>5</mn><mo>=</mo><mn>7</mn></mrow></math>.</span></p><div class="mb-2"><h3 data-id="pg119_n0060" class="adt-h3 font-bold text-slate-900">Solution</h3></div><p class="adt-body text-left leading-relaxed mb-2"><span data-id="pg119_n0062">To make k remain alone on the left-hand side of the equation, add 5 on both sides.</span></p><div class="mb-4 space-y-1 pl-6 max-sm:pl-3 text-left"><div data-id="pg119_n0064" class="adt-body text-slate-900">k - 5 + 5 = 7 + 5</div><div data-id="pg119_n0065" class="adt-body text-slate-900 pl-4 max-sm:pl-2">k + 0 = 12</div><div data-id="pg119_n0066" class="adt-body text-slate-900 pl-8 max-sm:pl-4">k = 12</div></div><p class="adt-body text-left leading-relaxed"><span data-id="pg119_n0068">Therefore, the value of k is 12.</span></p></div></div></section></div>
