      <div id="content" class="container opacity-0"><section data-section-type="boxed_text" data-section-id="pg038_sec001" class="mx-auto w-full max-w-5xl px-8 max-lg:px-6 max-sm:px-5 py-10 bg-gradient-to-br from-emerald-50 via-white to-lime-50"><div class="mx-auto max-w-4xl"><div class="rounded-[2rem] border border-emerald-200 bg-white/95 shadow-[0_10px_24px_rgba(16,185,129,0.08)] overflow-hidden"><div class="px-6 pt-0 max-sm:px-5"><div data-id="pg038_n0025" class="adt-h2 inline-block -mb-px rounded-tl-[1.5rem] rounded-tr-[1.5rem] rounded-br-[1.5rem] rounded-bl-none border border-emerald-700 bg-gradient-to-b from-[#c5cfbc] to-[#a9b4a1] px-6 py-3 font-bold text-emerald-900 shadow-sm">Example 1</div></div><div class="px-6 pb-6 pt-5 max-sm:px-5 max-sm:pb-5 space-y-5"><div class="flex items-start justify-between gap-6 max-sm:block"><p class="adt-body text-slate-800 leading-relaxed flex-1"><span data-id="pg038_n0027">Find the area of a circle with radius 14 mm.</span></p><div class="adt-body text-slate-900 leading-relaxed whitespace-nowrap max-sm:whitespace-normal max-sm:mt-2"><span data-id="pg038_n0028">Use <math><mrow><mi>π</mi><mo>=</mo><mstyle displaystyle="true" scriptlevel="0"><mfrac><mn>22</mn><mn>7</mn></mfrac></mstyle></mrow></math></span></div></div><div data-id="pg038_n0030" class="adt-h3 font-bold text-slate-900">Solution</div><div class="space-y-4"><p class="adt-body text-slate-800 leading-relaxed"><span data-id="pg038_n0032">Area of a circle = <math><mrow><mi>π</mi><msup><mi>r</mi><mn class="tml-sml-pad">2</mn></msup></mrow></math></span></p><div data-id="pg038_n0033" class="adt-body text-slate-900 leading-relaxed break-words text-center max-sm:text-left"><math><mrow><mo>=</mo><mstyle displaystyle="true" scriptlevel="0"><mfrac><mn>22</mn><mn>7</mn></mfrac></mstyle><mo>×</mo><mn>14</mn><mtext> </mtext><mpadded lspace="0"><mi>mm</mi></mpadded><mo>×</mo><mn>14</mn><mtext> </mtext><mpadded lspace="0"><mi>mm</mi></mpadded></mrow></math></div><div data-id="pg038_n0034" class="adt-body text-slate-900 leading-relaxed break-words text-center max-sm:text-left"><math><mrow><mo>=</mo><mn>616</mn><mtext> </mtext><msup><mpadded lspace="0"><mi>mm</mi></mpadded><mn>2</mn></msup></mrow></math></div></div><p class="adt-body text-slate-800 leading-relaxed"><span data-id="pg038_n0036">Therefore, the area of the circle is <math><mrow><mn>616</mn><mtext> </mtext><msup><mpadded lspace="0"><mi>mm</mi></mpadded><mn>2</mn></msup></mrow></math>.</span></p></div></div></div></section></div>
