      <h1 class="sr-only" id="page-heading">Example 2</h1>
      <div id="content" class="container opacity-0"><section data-section-type="boxed_text" data-section-id="pg125_sec001" class="mx-auto w-full max-w-5xl px-8 max-sm:px-5 py-10">
  <div class="rounded-[2rem] border border-emerald-700 bg-white shadow-[0_10px_30px_rgba(16,185,129,0.10)] overflow-hidden">
    <div class="px-6 pt-4 max-sm:px-4">
      <div class="inline-block rounded-tl-[1.5rem] rounded-tr-[1.5rem] rounded-br-[0.2rem] rounded-bl-[1.5rem] border border-emerald-700 bg-gradient-to-b from-emerald-200 to-stone-300 px-5 py-3 min-w-[17rem] max-sm:min-w-0 max-sm:w-full">
        <div data-id="pg125_n0003" class="adt-h2 font-bold text-emerald-900">Example 2</div>
      </div>
    </div>
    <div class="mx-6 mb-6 -mt-px rounded-[1.75rem] border border-emerald-200 bg-white px-6 py-6 max-sm:mx-4 max-sm:px-4 space-y-5 text-left">
      <p class="adt-body text-slate-800 leading-relaxed"><span data-id="pg125_n0005">Find the value of <math><mi>m</mi></math> if, <math><mrow><mn>2</mn><mo>÷</mo><mi>m</mi><mo>=</mo><mn>7</mn></mrow></math>.</span></p>
      <div data-id="pg125_n0007" class="adt-h3 font-bold text-slate-900">Solution</div>
      <p class="adt-body text-slate-800 leading-relaxed"><span data-id="pg125_n0009"><math><mrow><mn>2</mn><mo>÷</mo><mi>m</mi><mo>=</mo><mn>7</mn></mrow></math> can be written as <math><mrow><mstyle displaystyle="true" scriptlevel="0"><mfrac><mn>2</mn><mi>m</mi></mfrac></mstyle><mo>=</mo><mn>7</mn></mrow></math>.</span></p>
      <div class="space-y-3">
        <p class="adt-body text-slate-800 leading-relaxed"><span data-id="pg125_n0011">Multiply both sides of the equation by <math><mi>m</mi></math> (the denominator).</span></p>
        <div data-id="pg125_n0012" class="adt-body text-slate-900 pl-10 max-sm:pl-0 leading-relaxed"><math><mrow><mi>m</mi><mo>×</mo><mfrac><mn>2</mn><mi>m</mi></mfrac><mo>=</mo><mn>7</mn><mo>×</mo><mi>m</mi></mrow></math></div>
        <div data-id="pg125_n0013" class="adt-body text-slate-900 pl-16 max-sm:pl-0 leading-relaxed">2=7m</div>
      </div>
      <div class="space-y-3">
        <p class="adt-body text-slate-800 leading-relaxed"><span data-id="pg125_n0015">Divide both sides of the equation by <math><mn>7</mn></math> to get the value of <math><mi>m</mi></math>.</span></p>
        <div data-id="pg125_n0016" class="adt-body text-slate-900 pl-16 max-sm:pl-0 leading-relaxed"><math><mrow><mfrac><mn>2</mn><mn>7</mn></mfrac><mo>=</mo><mfrac><mrow><mn>7</mn><mi>m</mi></mrow><mn>7</mn></mfrac></mrow></math></div>
        <div data-id="pg125_n0017" class="adt-body text-slate-900 pl-16 max-sm:pl-0 leading-relaxed"><math><mrow><mfrac><mn>2</mn><mn>7</mn></mfrac><mo>=</mo><mi>m</mi></mrow></math></div>
      </div>
      <p class="adt-body text-slate-800 leading-relaxed"><span data-id="pg125_n0019">Therefore, the value of <math><mi>m</mi></math> is <math><mstyle displaystyle="true" scriptlevel="0"><mfrac><mn>2</mn><mn>7</mn></mfrac></mstyle></math>.</span></p>
    </div>
