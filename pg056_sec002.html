    <main class="w-full">
      <div id="content" class="container opacity-0"><section data-section-type="text_only" data-section-id="pg056_sec002" class="mx-auto w-full max-w-5xl px-8 max-sm:px-5 py-10 bg-white text-slate-800"><h1 data-id="pg056_n0066" class="adt-h2 font-bold text-green-700 mb-4 text-left">Multiples of numbers</h1><p class="adt-body leading-relaxed text-left mb-3"><span data-id="pg056_n0068">If any number is multiplied by counting number, then the result is called a multiple.</span> <span data-id="pg056_n0069">The plural of multiple is multiples.</span></p><p class="adt-body leading-relaxed text-left mb-3"><span data-id="pg056_n0071">12 &#xd7; 1 = 12,</span> <span data-id="pg056_n0072">12 &#xd7; 2 = 24,</span> <span data-id="pg056_n0073">12 &#xd7; 3 = 36,</span></p><p class="adt-body leading-relaxed text-left"><span data-id="pg056_n0075">Therefore 12, 24 and 36 are multiples of 12.</span> <span data-id="pg056_n0076">Multiples of a number can be listed by using the following examples.</span></p></section></div>
