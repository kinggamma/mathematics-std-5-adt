<body class="min-h-screen flex items-center justify-center">
    <main class="w-full">
      <div id="content" class="container opacity-0"><section data-section-type="boxed_text" data-section-id="pg089_sec003" class="mx-auto w-full max-w-5xl px-8 max-sm:px-5 py-8 bg-gradient-to-b from-[#f7fbf7] to-white text-left text-neutral-800"><div class="mb-5"><h1 data-id="pg089_n0023" class="adt-h2 font-bold text-[#c75a16]">Division of whole numbers by decimals</h1></div><div class="rounded-[2rem] border border-[#b8c9b1] bg-white shadow-sm overflow-hidden"><div class="px-6 pt-5 pb-3"><div data-id="pg089_n0025" class="adt-h3 inline-block rounded-[1.2rem] bg-gradient-to-b from-[#c8d3bf] to-[#aebda2] border-2 border-[#2f7a45] text-[#116530] font-bold px-5 py-3">Example 1</div><div class="mt-4"><div data-id="pg089_n0026" class="adt-body text-neutral-900 font-serif whitespace-pre-wrap break-words"><math><mrow><mn>24</mn><mo>÷</mo><mn>0.2</mn><mo>=</mo></mrow></math></div></div></div><div class="grid grid-cols-[1.25fr_0.75fr] max-lg:grid-cols-1 border-t border-[#b8c9b1]"><div class="p-6 border-r border-[#b8c9b1] max-lg:border-r-0 max-lg:border-b"><h3 data-id="pg089_n0027" class="adt-h3 font-bold text-neutral-800 mb-3">Steps</h3><div class="space-y-3"><div data-id="pg089_n0028" class="adt-body text-neutral-800">1. Arrange the numbers as a fraction</div><div data-id="pg089_n0029" class="adt-body text-neutral-800">2. Multiply the numerator and the denominator by 10 to remove the decimal</div><div data-id="pg089_n0030" class="adt-body text-neutral-800">3. Divide 240 by 2 to get 120</div></div></div><div class="p-6 bg-[#fcfdfb]"><h3 data-id="pg089_n0031" class="adt-h3 font-bold text-neutral-800 mb-3">Solution</h3><div class="space-y-4"><div data-id="pg089_n0032" class="adt-body text-neutral-900 font-serif whitespace-pre-wrap break-words leading-relaxed"><math><mrow><mn>24</mn><mo>÷</mo><mn>0.2</mn><mo>=</mo><mfrac><mn>24</mn><mn>0.2</mn></mfrac></mrow></math></div><div data-id="pg089_n0033" class="adt-body text-neutral-900 font-serif whitespace-pre-wrap break-words leading-relaxed"><math><mrow><mfrac><mrow><mn>24</mn><mo>×</mo><mn>10</mn></mrow><mrow><mn>0.2</mn><mo>×</mo><mn>10</mn></mrow></mfrac><mo>=</mo><mfrac><mn>240</mn><mn>2</mn></mfrac><mo>=</mo><mn>120</mn></mrow></math></div></div></div></div><div class="px-6 py-4 border-t border-[#b8c9b1] bg-white"><p data-id="pg089_n0034" class="adt-body text-neutral-900">Therefore, 24 &#xf7; 0.2 = 120</p></div></div></section></div>
